# Render blueprint: runs the DiaVita API online (free plan, Singapore, next to the Neon database).
# Render -> New -> Blueprint -> pick this repository, then paste DATABASE_URL (and optionally SARVAM_API_KEY).
services:
  - type: web
    name: diavita-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon connection string, the same one as in backend/.env (entered in Render, never committed)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # https://localhost is the Android app (Capacitor); http://localhost:3000 is the website on a laptop
      - key: CORS_ORIGIN
        value: https://localhost,http://localhost:3000
      - key: APP_TZ
        value: Asia/Kolkata
      # optional natural voice (https://dashboard.sarvam.ai)
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_SPEAKER
        value: kavitha
