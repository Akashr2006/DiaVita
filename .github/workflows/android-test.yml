# Runs the published DiaVita.apk on an Android emulator and reports what the voice does inside the real app.
# Start it by hand: Actions > Android voice test > Run workflow (or: gh workflow run android-test.yml)
name: Android voice test

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download mobile-latest -p DiaVita.apk

      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: node .github/android-test/drive.mjs

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android-test-results
